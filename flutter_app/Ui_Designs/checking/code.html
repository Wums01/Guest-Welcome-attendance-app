<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guest Check-in | Welcome Attendance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f49bd", // Deep Navy equivalent from theme
                        "accent": "#d4af37", // Gold accent for church ministry style
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Poppins", "sans-serif"],
                        "sans": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .keypad-button {
            @apply flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<div class="w-12"></div> <!-- Spacer for symmetry -->
<h1 class="text-xl font-bold tracking-tight text-primary dark:text-slate-100 font-display">Check-in</h1>
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-1 flex flex-col items-center px-6 max-w-md mx-auto w-full">
<!-- Header Text -->
<div class="text-center mt-8 mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 text-primary mb-4">
<span class="material-symbols-outlined text-4xl">church</span>
</div>
<h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-2 font-display">Welcome!</h2>
<p class="text-slate-600 dark:text-slate-400 text-base">Enter your 6-digit attendance code below</p>
</div>
<!-- 6-Digit Code Input -->
<div class="w-full mb-8">
<div class="flex justify-between gap-2 sm:gap-4">
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-16 sm:w-14 sm:h-20 text-center text-3xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-accent dark:focus:border-accent bg-white dark:bg-slate-800 focus:ring-0 transition-all" maxlength="1" placeholder="•" type="text"/>
</div>
</div>
<!-- QR Scan Option -->
<div class="w-full mb-10">
<button class="w-full flex items-center justify-center gap-3 h-14 bg-slate-100 dark:bg-slate-800 text-primary dark:text-accent font-bold rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span>Scan QR Code instead</span>
</button>
</div>
<!-- Numeric Keypad -->
<div class="w-full grid grid-cols-3 gap-3 mb-8 mt-auto">
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">1</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">2</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">3</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">4</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">5</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">6</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">7</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">8</button>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">9</button>
<div class="h-16 w-full"></div>
<button class="flex items-center justify-center text-2xl font-semibold h-16 w-full rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm border border-slate-200 dark:border-slate-700 active:bg-primary/10 transition-colors">0</button>
<button class="flex items-center justify-center h-16 w-full rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Submit Button -->
<button class="w-full h-16 bg-primary dark:bg-primary text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mb-8 active:scale-[0.98] transition-all">
<span>Confirm Check-in</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
<!-- Footer Decoration -->
<footer class="mt-auto py-6 flex flex-col items-center opacity-40">
<div class="h-1 w-12 bg-accent rounded-full mb-2"></div>
<p class="text-xs uppercase tracking-widest font-semibold">Attendance Ministry</p>
</footer>
</body></html>
