<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#131313",
            "primary-fixed-dim": "#bfc5e4",
            "secondary-fixed": "#ffe16d",
            "on-secondary": "#3a3000",
            "inverse-on-surface": "#313030",
            "outline": "#909098",
            "surface-container-high": "#2a2a2a",
            "primary-fixed": "#dce1ff",
            "on-secondary-container": "#725f00",
            "on-error": "#690005",
            "tertiary-container": "#c9a900",
            "error-container": "#93000a",
            "background": "#131313",
            "tertiary-fixed": "#ffe16d",
            "surface-bright": "#393939",
            "on-primary-fixed": "#141a32",
            "tertiary": "#e9c400",
            "on-tertiary": "#3a3000",
            "surface-variant": "#353534",
            "on-tertiary-fixed": "#221b00",
            "surface-container-highest": "#353534",
            "on-background": "#e5e2e1",
            "secondary-container": "#ffdb3c",
            "on-primary-container": "#767c99",
            "tertiary-fixed-dim": "#e9c400",
            "primary": "#bfc5e4",
            "on-secondary-fixed": "#221b00",
            "on-primary": "#292f48",
            "surface-container-low": "#1c1b1b",
            "on-surface": "#e5e2e1",
            "on-error-container": "#ffdad6",
            "error": "#ffb4ab",
            "on-tertiary-fixed-variant": "#544600",
            "on-surface-variant": "#c6c6ce",
            "secondary": "#fff9ef",
            "outline-variant": "#46464d",
            "on-tertiary-container": "#4c3f00",
            "inverse-surface": "#e5e2e1",
            "on-primary-fixed-variant": "#3f465f",
            "surface-tint": "#bfc5e4",
            "surface-dim": "#131313",
            "surface-container": "#201f1f",
            "primary-container": "#0a1128",
            "on-secondary-fixed-variant": "#544600",
            "secondary-fixed-dim": "#e9c400",
            "surface-container-lowest": "#0e0e0e",
            "inverse-primary": "#575d78"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Plus Jakarta Sans"],
            "label": ["Plus Jakarta Sans"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .tonal-shift-bg {
      background: linear-gradient(180deg, rgba(10, 17, 40, 0.8) 0%, rgba(19, 19, 19, 0.9) 100%);
    }
    .glass-morphism {
      backdrop-filter: blur(24px);
      background: rgba(32, 31, 31, 0.7);
    }
    .celebratory-ring {
      box-shadow: 0 0 40px rgba(233, 196, 0, 0.15);
    }
    .editorial-shadow {
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-indigo-200 dark:text-indigo-100 cursor-pointer scale-95 active:duration-150" data-icon="arrow_back">arrow_back</span>
<h1 class="font-plus-jakarta-sans font-bold tracking-tight text-on-surface text-lg">Member Check-in</h1>
</div>
<span class="material-symbols-outlined text-indigo-200 dark:text-indigo-100 cursor-pointer hover:bg-white/5 transition-colors p-2 rounded-full" data-icon="more_vert">more_vert</span>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-10 relative">
<!-- Atmospheric Background Patterns -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container/20 rounded-full blur-[100px]"></div>
</div>
<!-- Central Verification Content -->
<div class="z-10 flex flex-col items-center w-full max-w-md">
<!-- Profile Picture Section -->
<div class="relative mb-8 group">
<div class="w-48 h-48 rounded-full border-4 border-tertiary p-1.5 celebratory-ring bg-gradient-to-tr from-tertiary to-secondary-fixed overflow-hidden">
<img alt="David Chen" class="w-full h-full object-cover rounded-full" data-alt="high-quality portrait of a smiling young man with dark hair in professional yet casual studio lighting against a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoBDDHPvQwhi-kPs2wyjTcHq4I8TOR5Vmia7scK9l3iRfIuulpwzJpaout9qjb9ejSX--GDNQA5TBddLkGLS55ijKP7hZG8BA1EJrqX2jbEX5wnDckARSj8KFIuawixXlqWM0ZIjnurXGKFVyfcgwqcubQXo7SIKcCpmhrFdc6aGBeKauEaRrC0xLA_Q-kPuPbR1wl-Mka0kUWxBuJG_ysMKCFO-aRezWRJ0P1HosXvINqcGHcV5TarpIL4F9SkDsyBU6JmEls1wWF"/>
</div>
<!-- Animated-Ready Status Ring -->
<div class="absolute -bottom-6 left-1/2 -translate-x-1/2">
<div class="w-16 h-16 rounded-full bg-surface-container-high border-2 border-tertiary flex items-center justify-center shadow-xl">
<div class="w-12 h-12 rounded-full bg-tertiary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-3xl font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
</div>
<!-- Confirmation Messaging -->
<div class="mt-12 text-center">
<h2 class="text-3xl md:text-4xl font-headline font-extrabold text-tertiary tracking-tight editorial-shadow mb-2">Check-in Successful!</h2>
<div class="flex items-center justify-center gap-2 text-on-surface-variant font-medium">
<span class="material-symbols-outlined text-sm" data-icon="verified">verified</span>
<span class="tracking-wide uppercase text-[10px] font-bold">Verification Confirmed</span>
</div>
</div>
<!-- Member Details Card -->
<div class="mt-10 w-full glass-morphism rounded-3xl p-8 border border-white/5 space-y-6">
<div class="flex flex-col items-center text-center">
<p class="text-2xl font-bold text-on-surface mb-1">David Chen</p>
<div class="inline-flex items-center gap-2 px-3 py-1 bg-secondary-container/10 rounded-full border border-secondary-container/20">
<span class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse"></span>
<span class="text-xs font-bold text-secondary-fixed tracking-widest uppercase">Team B</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/5">
<div class="flex flex-col">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Status</span>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-400"></div>
<span class="text-sm font-semibold text-on-surface">Present</span>
</div>
</div>
<div class="flex flex-col text-right">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Entry Time</span>
<span class="text-sm font-semibold text-on-surface">08:45 AM</span>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="fixed bottom-32 w-full max-w-md px-10">
<button class="w-full h-16 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-bold text-lg flex items-center justify-center gap-3 shadow-2xl active:scale-95 transition-transform">
        Continue to Next
        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-slate-950/90 backdrop-blur-2xl rounded-t-3xl border-t border-white/5 shadow-[0_-8px_30px_rgb(0,0,0,0.12)]">
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-indigo-200 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-[11px] font-semibold uppercase tracking-widest font-plus-jakarta-sans">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-amber-400 bg-amber-400/10 rounded-xl px-3 py-1 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="fact_check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fact_check</span>
<span class="text-[11px] font-semibold uppercase tracking-widest font-plus-jakarta-sans">Attendance</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-indigo-200 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="groups">groups</span>
<span class="text-[11px] font-semibold uppercase tracking-widest font-plus-jakarta-sans">Teams</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-indigo-200 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="text-[11px] font-semibold uppercase tracking-widest font-plus-jakarta-sans">Settings</span>
</div>
</nav>
</body></html>
