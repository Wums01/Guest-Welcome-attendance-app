name: attendance_app
description: Guest Welcome Attendance App — Flutter migration from Next.js
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Date / time formatting
  intl: ^0.19.0

  # Poppins font (matches web app)
  google_fonts: ^6.2.1

  # UUID generation for new records
  uuid: ^4.5.1

  # Persist staff session across app restarts
  shared_preferences: ^2.3.4

  # Video background on profile picker screen
  video_player: ^2.9.2

  # Icons
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.2.0

  # QR code generation
  qr_flutter: ^4.1.0

  # URL launching (WhatsApp share, tel: links)
  url_launcher: ^6.3.1

  # Local push notifications (birthday / anniversary / absence alerts)
  flutter_local_notifications: ^18.0.0

  # Firebase push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Avatar image picker + cache
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Charts for Reports screen
  fl_chart: ^0.69.0

  # File sharing (QR image + CSV export)
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  excel: ^4.0.6
  
  # Offline support
  sqflite: ^2.3.2
  connectivity_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/videos/
