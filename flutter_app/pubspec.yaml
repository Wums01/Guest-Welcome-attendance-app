name: attendance_app
description: Guest Welcome Attendance App — Flutter migration from Next.js
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Date / time formatting
  intl: ^0.19.0

  # Poppins font (matches web app)
  google_fonts: ^6.2.1

  # UUID generation for new records
  uuid: ^4.5.1

  # Persist staff session across app restarts
  shared_preferences: ^2.3.4

  # Video background on profile picker screen
  video_player: ^2.9.2

  # Icons
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.2.0

  # QR code generation
  qr_flutter: ^4.1.0

  # URL launching (WhatsApp share, tel: links)
  url_launcher: ^6.3.1

  # Local push notifications (birthday / anniversary / absence alerts)
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
